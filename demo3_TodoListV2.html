<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">TO-DO LIST</h1>
        <div class="d-flex gap-2 w-75 mx-auto">
            <input type="text" id="task" placeholder="Add new Task ..." id="task" class="form-control">
            <button type="button" id="btnAdd" class="btn  btn-success">Add</button>
        </div>
        <div class="mt-3 p-3 w-75 mx-auto shadow border" id="tasks"></div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="text/javascript">
        document.querySelector('#btnAdd').addEventListener('click',function(){
            let newTask=document.querySelector('#task').value;
            let newLine=document.createElement('div');
            newLine.classList.add("d-flex");
            newLine.classList.add("justify-content-between");
            newLine.classList.add("mb-3");
            newLine.innerHTML=`<div class="form-check">
                <input type="checkbox" class="form-check-input" id="status"/>
                <label class="form-check-label" for="status">${newTask}</label>
            </div><button class="btn btn-danger">Delete</button>`;
            document.querySelector('#tasks').appendChild(newLine);
            document.querySelector('#task').value='';
            document.querySelector('#task').focus();
       
       
       
        });

    </script>

</body>
</html>
