<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Gestion des employés</title>
</head>
<body class="bg-light">
    <div class="container bg-light  pt-2">

        <h1 class="text-center text-shadow"><i class="bi bi-people-fill "></i> Gestion des employés</h1>

        <form action="" class="shadow p-4 mt-5 rounded w-75 m-auto bg-white border border-1 border-success">

            <div class="row mb-3">
                <div class="col "> 
                    <label class="form-label" for="nom">Nom</label>
                    <input class="form-control" id="nom" type="text" placeholder="Noah" required>
                </div>
                <div class="col">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" type="email" placeholder="trevor_noah@gmail.com" required>
                </div>  
            </div> 
            <div class="row mb-3">
                <div class="col"> 
                    <label class="form-label" for="departement">Département</label>
                    <select class="form-select" id="departement" required>
                        <option value="" disabled selected>Choisir un département</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Informatique">Informatique</option>
                        <option value="RH">RH</option>
                    </select>    
                </div>
                <div class="col">
                    <label class="form-label d-block">Genre</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="genre" id="homme" value="Homme" checked>
                        <label class="form-check-label" for="homme">Homme</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="genre" id="femme" value="Femme" >
                        <label class="form-check-label" for="femme">Femme</label>
                    </div>
                </div>  
            </div>
            <label class="form-label d-block">Compétences</label>
            <div class="form-check form-check-inline">
                <input type="checkbox" name="competences" id="html" class="form-check-input" value="HTML" checked>
                <label for="html" class="form-check-label">HTML</label>
            </div>
            <div class="form-check form-check-inline">
                <input type="checkbox" name="competences" id="css"  class="form-check-input" value="CSS" checked>
                <label for="css" class="form-check-label">CSS</label>
            </div>
            <div class="form-check form-check-inline">
                <input type="checkbox" name="competences" id="javascript" class="form-check-input" value="JS" checked>
                <label for="javascript" class="form-check-label">JavaScript</label>
            </div>
            <button id="ajouter" class="btn btn-success mt-3 mx-auto d-block fw-bold " type="button"><i class="bi bi-person-plus-fill"></i> Ajouter Employé</button>

        </form>
        
        <span class="text-bg-success" id="added">&nbsp;</span>
        
        <table class="table table-bordered table-striped shadow mt-3 w-75 mx-auto text-center ">
            <thead class="table-dark ">
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Département</th>
                    <th>Genre</th>
                    <th >Compétences</th>
                </tr>
            </thead>
            <tbody class="emp_table">
                
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
