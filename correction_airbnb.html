<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Airbnb simple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   
    
</head>
<body>

<form class="w-25 mx-auto mt-5 bg-white p-4 rounded shadow">
    <h3 class="mb-3">Réserver un logement</h3>

    
    <label for="listingSelect" class="form-label">Choisir un logement:</label>
    <select id="listingSelect" class="form-select mb-3">
        <option value="" selected disabled>choisir une option...</option>
      <option value="70">choix (70 DH)</option>
       <option value="100">choix (100 DH)</option>
       <option value="150">choix (150 DH)</option>
    </select>

    
    <label for="arrivalDate" class="form-label">Date d'arrivée:</label>
    <input type="date" id="arrivalDate" class="form-control mb-3">

   
    <label for="departureDate" class="form-label">Date de départ:</label>
    <input type="date" id="departureDate" class="form-control mb-3">

   
    <p class="total-price h3"></p>

   
</div>

<script>
   document.querySelector("#departureDate").addEventListener('change',function(e){
   let allDates=document.querySelectorAll('input[type=date]');
    let dateArr=new Date(allDates[0].value);
    let dateDept=new Date(allDates[1].value);
    let choix=parseInt(document.querySelector('#listingSelect').value);
   let total=((dateDept-dateArr)/(1000*60*60*24))*choix;
   document.querySelector('.total-price').textContent=`Total à payer est: ${total} DH`;

   });
</script>

</body>
</html>
