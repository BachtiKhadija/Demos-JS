<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container w-75 mx-auto p-4">
        <form id="formAdd" action="" class="w-75 mx-auto border shadow rounded mb-4 p-4 bg-light">
              <h2>Ajouter un nouveau produit</h2>
              <div class="mb-3">
                <label for="libelle">Libelle</label>
                <input type="text" id="libelle" class="form-control">
              </div>
              <div class="mb-3">
                <label for="prixu">Prix Unitaire</label>
                <input type="prixu" id="prixu" step="0.01" class="form-control">
              </div>
                <div class="mb-3">
                <label for="image">Image</label>
                <input type="text" id="image"  class="form-control">
              </div>
                  <div class="mb-3">
               
                <button class="btn btn-primary" type="submit">Add</button> 
              </div>



        </form>
        <table class="table table-striped">
            <thead>
                <tr><th>Ref</th><th>Libelle</th><th>Prix unitaire</th><th>image</th><th>Actions</th></tr>
            </thead>
            <tbody id="content">


            </tbody>


        </table>

    </div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script type="text/javascript">
        let produits=[{ref:100,libelle:"clavier",prixU:150.00,image:"./images/clavier.png"},{ref:101,libelle:"souris",prixU:100.00,image:"./images/souris.png"},{ref:102,libelle:"clavier",prixU:150.00,image:"./images/clavier.png"}];
         //transformer chaque objet en TR 
         let data=''
         for(let p of produits){
           data+=`<tr><td>${p.ref}</td><td>${p.libelle}</td><td>${p.prixU}</td><td><img src=${p.image} width="60px" height="60px" class="rounded-circle"/></td><td><button type="button" id="${p.ref}" class="del btn btn-sm btn-danger">delete</button></td></tr>`
        }
         
        document.querySelector('#content').innerHTML=data;
         //gérer l'event submit du formulaire #formAdd
         document.querySelector('#formAdd').addEventListener('submit',function(e){
              e.preventDefault();
              let newProduct={};
              newProduct['libelle']=document.querySelector('#libelle').value;
              newProduct['prixU']=document.querySelector('#prixu').value;
              newProduct['image']=document.querySelector('#image').value;
              newProduct['ref']=produits[produits.length-1].ref+1;
              produits.push(newProduct);
              console.log(produits);
              //recharger la table html 
                 let data=''
                for(let p of produits){
                data+=`<tr><td>${p.ref}</td><td>${p.libelle}</td><td>${p.prixU}</td><td><img src=${p.image} width="60px" height="60px" class="rounded-circle"/></td><td><button id="${p.ref}" type="button" class="del btn btn-sm btn-danger">delete</button></td></tr>`
                }
                 document.querySelector('#content').innerHTML=data;

         });
          //gérer le clic sur les boutons .del
          let addDelBtn=document.querySelectorAll('.del');
          addDelBtn.forEach(function(b,pos){
            b.addEventListener('click',function(e){
                let r=b.getAttribute('id');
                let p=-1;
                for(let i in produits){

                    if(produits[i].ref==r){
                        p=i ;break;
                    }
                }
                if(p!=-1){
                    produits.splice(p,1);
                    console.log(produits);

                     //recharger la table html 
                            let data=''
                            for(let p of produits){
                            data+=`<tr><td>${p.ref}</td><td>${p.libelle}</td><td>${p.prixU}</td><td><img src=${p.image} width="60px" height="60px" class="rounded-circle"/></td><td><button id="${p.ref}" type="button" class="del btn btn-sm btn-danger">delete</button></td></tr>`
                            }
                            document.querySelector('#content').innerHTML=data;
                            }


            })
          })
    </script>
</body>
</html>
